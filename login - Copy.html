<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BugFlow - Login</title>


<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<!-- =====================================================
     CSS
====================================================== -->

<style>

    /* =====================================================
       RESET
    ====================================================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    html,
    body {
        width: 100%;
        min-height: 100%;
    }


    body {

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #0f172a 0%,
                #172554 45%,
                #2563eb 100%
            );

        color: #172033;

    }


    /* =====================================================
       PAGE
    ====================================================== */

    .login-page {

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 30px 20px;

    }


    /* =====================================================
       WRAPPER
    ====================================================== */

    .login-wrapper {

        width: 100%;

        max-width: 440px;

    }


    /* =====================================================
       BRAND
    ====================================================== */

    .brand {

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 14px;

        margin-bottom: 26px;

        color: white;

    }


    .brand-logo {

        width: 58px;

        height: 58px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 16px;

        background: rgba(
            255,
            255,
            255,
            0.14
        );

        border: 1px solid rgba(
            255,
            255,
            255,
            0.2
        );

        font-size: 30px;

        box-shadow:
            0 12px 35px
            rgba(
                0,
                0,
                0,
                0.25
            );

    }


    .brand-text h1 {

        font-size: 28px;

        font-weight: 700;

        letter-spacing: -0.5px;

    }


    .brand-text p {

        margin-top: 3px;

        color: #dbeafe;

        font-size: 12px;

    }


    /* =====================================================
       LOGIN CARD
    ====================================================== */

    .login-card {

        width: 100%;

        background: #ffffff;

        border-radius: 20px;

        padding: 38px;

        box-shadow:
            0 25px 70px
            rgba(
                0,
                0,
                0,
                0.30
            );

    }


    /* =====================================================
       HEADER
    ====================================================== */

    .login-header {

        margin-bottom: 30px;

    }


    .login-header h2 {

        color: #111827;

        font-size: 26px;

        font-weight: 700;

        margin-bottom: 8px;

    }


    .login-header p {

        color: #64748b;

        font-size: 14px;

        line-height: 1.5;

    }


    /* =====================================================
       FORM
    ====================================================== */

    .form-group {

        margin-bottom: 20px;

    }


    .form-group label {

        display: block;

        margin-bottom: 8px;

        color: #334155;

        font-size: 13px;

        font-weight: 600;

    }


    .input-wrapper {

        position: relative;

    }


    .form-input {

        width: 100%;

        height: 48px;

        padding:
            0 14px;

        border:
            1px solid #cbd5e1;

        border-radius: 10px;

        background: #ffffff;

        color: #172033;

        font-size: 14px;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;

    }


    .form-input::placeholder {

        color: #94a3b8;

    }


    .form-input:focus {

        border-color: #2563eb;

        box-shadow:
            0 0 0 4px
            rgba(
                37,
                99,
                235,
                0.10
            );

    }


    /* =====================================================
       PASSWORD TOGGLE
    ====================================================== */

    .password-toggle {

        position: absolute;

        right: 12px;

        top: 50%;

        transform: translateY(-50%);

        border: none;

        background: transparent;

        cursor: pointer;

        color: #64748b;

        font-size: 12px;

        font-weight: 600;

        padding: 5px;

    }


    .password-toggle:hover {

        color: #2563eb;

    }


    /* =====================================================
       LOGIN BUTTON
    ====================================================== */

    .login-button {

        width: 100%;

        height: 48px;

        border: none;

        border-radius: 10px;

        background: #2563eb;

        color: white;

        font-size: 14px;

        font-weight: 700;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;

    }


    .login-button:hover {

        background: #1d4ed8;

        transform:
            translateY(-1px);

        box-shadow:
            0 8px 20px
            rgba(
                37,
                99,
                235,
                0.25
            );

    }


    .login-button:active {

        transform:
            translateY(0);

    }


    .login-button:disabled {

        opacity: 0.65;

        cursor: not-allowed;

        transform: none;

        box-shadow: none;

    }


    /* =====================================================
       MESSAGE
    ====================================================== */

    .login-message {

        min-height: 20px;

        margin-top: 15px;

        text-align: center;

        font-size: 13px;

        line-height: 1.4;

    }


    .login-message.error {

        color: #dc2626;

    }


    .login-message.success {

        color: #16a34a;

    }


    /* =====================================================
       REGISTER
    ====================================================== */

    .register-section {

        margin-top: 25px;

        padding-top: 22px;

        border-top:
            1px solid #e5e7eb;

        text-align: center;

        color: #64748b;

        font-size: 13px;

    }


    .register-section a {

        color: #2563eb;

        font-weight: 600;

        text-decoration: none;

        margin-left: 4px;

    }


    .register-section a:hover {

        text-decoration: underline;

    }


    /* =====================================================
       FOOTER
    ====================================================== */

    .login-footer {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 8px;

        margin-top: 20px;

        color: #cbd5e1;

        font-size: 11px;

    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (
        max-width: 520px
    ) {

        .login-page {

            padding:
                20px 15px;

        }


        .login-card {

            padding:
                30px 22px;

            border-radius:
                16px;

        }


        .brand-logo {

            width: 50px;

            height: 50px;

            font-size: 25px;

        }


        .brand-text h1 {

            font-size: 24px;

        }


        .login-header h2 {

            font-size: 23px;

        }

    }

</style>

</head>

<body>

<!-- =========================================================
     LOGIN PAGE
========================================================= -->

<div class="login-page">


<div class="login-wrapper">


    <!-- =================================================
         BUGFLOW BRAND
    ================================================== -->

    <div class="brand">

        <div class="brand-logo">
            <i class="fa-solid fa-bug"></i>
        </div>


        <div class="brand-text">

            <h1>
                BugFlow
            </h1>

            <p>
                Software Issue Tracking
            </p>

        </div>

    </div>



    <!-- =================================================
         LOGIN CARD
    ================================================== -->

    <div class="login-card">


        <div class="login-header">

            <h2>
                Welcome back
            </h2>

            <p>
                Sign in to your BugFlow account
                to continue to your dashboard.
            </p>

        </div>



        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
            id="loginForm"
            autocomplete="on"
        >


            <!-- USERNAME -->

            <div class="form-group">

                <label
                    for="loginUsername"
                >
                    Username
                </label>


                <div class="input-wrapper">

                    <input
                        id="loginUsername"
                        class="form-input"
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label
                    for="loginPassword"
                >
                    Password
                </label>


                <div class="input-wrapper">

                    <input
                        id="loginPassword"
                        class="form-input"
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        id="passwordToggle"
                        class="password-toggle"
                    >
                        Show
                    </button>

                </div>

            </div>



            <!-- LOGIN BUTTON -->

            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                Sign In
            </button>


        </form>



        <!-- =================================================
             LOGIN MESSAGE
        ================================================== -->

        <div
            id="loginMessage"
            class="login-message"
            aria-live="polite"
        ></div>



        <!-- =================================================
             REGISTER
        ================================================== -->

        <div class="register-section">

            <span>
                Don't have an account?
            </span>


            <a href="/register">
                Register here
            </a>

        </div>


    </div>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <div class="login-footer">

        <span>
            <i class="fa-solid fa-bug"></i> BugFlow
        </span>

        <span>
            •
        </span>

        <span>
            Role-based Issue Tracking
        </span>

    </div>


</div>


</div>

<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    /* =========================================================
       API
    ========================================================= */

    const API = "/api/v1";


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const usernameInput =
        document.getElementById(
            "loginUsername"
        );


    const passwordInput =
        document.getElementById(
            "loginPassword"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const loginMessage =
        document.getElementById(
            "loginMessage"
        );


    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );



    /* =========================================================
       CHECK EXISTING LOGIN
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const existingToken =
                sessionStorage.getItem(
                    "access_token"
                );


            /*
             * If a token already exists,
             * open the dashboard.
             */

            if (existingToken) {

                window.location.href =
                    "/Dashboard";

                return;

            }

        }
    );



    /* =========================================================
       PASSWORD SHOW / HIDE
    ========================================================= */

    passwordToggle.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                passwordToggle.textContent =
                    "Hide";

            } else {

                passwordInput.type =
                    "password";

                passwordToggle.textContent =
                    "Show";

            }

        }
    );



    /* =========================================================
       LOGIN FORM
    ========================================================= */

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const username =
                usernameInput.value.trim();


            const password =
                passwordInput.value;


            /*
             * Validate fields.
             */

            if (
                !username ||
                !password
            ) {

                showMessage(
                    "Please enter username and password.",
                    "error"
                );

                return;

            }


            /*
             * Disable button.
             */

            loginButton.disabled =
                true;

            loginButton.textContent =
                "Signing in...";


            showMessage(
                "Signing in...",
                "success"
            );


            try {


                /* =============================================
                   SEND LOGIN REQUEST
                ============================================== */

                const response =
                    await fetch(
                        `${API}/auth/login`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    username:
                                        username,

                                    password:
                                        password

                                })

                        }
                    );



                /* =============================================
                   READ RESPONSE
                ============================================== */

                let data = {};


                try {

                    data =
                        await response.json();

                } catch {

                    data = {};

                }



                /* =============================================
                   HANDLE ERROR
                ============================================== */

                if (
                    !response.ok
                ) {

                    throw new Error(

                        data.detail ||
                        data.message ||
                        "Invalid username or password."

                    );

                }



                /* =============================================
                   GET TOKEN
                ============================================== */

                const token =

                    data.access_token ||

                    data.token ||

                    data.accessToken ||

                    "";



                if (!token) {

                    throw new Error(
                        "Login succeeded, but no access token was returned by the server."
                    );

                }



                /* =============================================
                   SAVE TOKEN
                ============================================== */

                sessionStorage.setItem(
                    "access_token",
                    token
                );



                /* =============================================
                   SUCCESS
                ============================================== */

                showMessage(
                    "Login successful. Opening dashboard...",
                    "success"
                );


                loginButton.textContent =
                    "Success";


                /*
                 * Open dashboard.
                 */

                setTimeout(
                    function () {

                        window.location.href =
                            "/Dashboard";

                    },
                    500
                );


            } catch (error) {


                console.error(
                    "BugFlow login error:",
                    error
                );


                /*
                 * Remove invalid token
                 * if one exists.
                 */

                sessionStorage.removeItem(
                    "access_token"
                );


                showMessage(
                    error.message ||
                    "Unable to login. Please try again.",
                    "error"
                );


                /*
                 * Re-enable button.
                 */

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Sign In";

            }

        }
    );



    /* =========================================================
       SHOW MESSAGE
    ========================================================= */

    function showMessage(
        message,
        type
    ) {

        loginMessage.textContent =
            message;


        loginMessage.className =
            "login-message " +
            type;

    }


</script>

</body>

</html>
